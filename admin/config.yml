backend:
  name: github
  repo: hatimbenziti/Smart-orga-siteweb-BANKSY
  branch: main
  base_url: https://www.smartorga.ma
  auth_endpoint: /api/auth

# Mode local actif pour développement (via npx decap-server)
local_backend: true

# Configuration des dossiers médias
media_folder: "public/uploads"
public_folder: "/uploads"

# Localisation de l'interface
locale: "fr"
display_url: "https://smartorga.ma"

collections:
  # 1. Collection : Voyages Organisés
  - name: "voyages"
    label: "Voyages Organisés"
    label_singular: "Voyage"
    folder: "content/voyages"
    create: true
    slug: "{{slug}}"
    format: "json"
    editor:
      preview: true
    sortable_fields: ['order', 'title', 'date']
    view_filters:
      - label: "Actifs"
        field: "archived"
        pattern: false
      - label: "Archivés"
        field: "archived"
        pattern: true
    fields:
      - { label: "Titre du Séjour", name: "title", widget: "string" }
      - { label: "Destination", name: "destination", widget: "string", default: "Taghazout" }
      - { label: "Thématique / Univers", name: "region", widget: "select", options: ["Nature & Randonnée", "Désert & Aventure", "Plage & Détente", "Montagne & Trekking", "Camping & Bivouac", "Culture & Patrimoine"], default: "Nature & Randonnée" }
      - { label: "Prix (MAD)", name: "price", widget: "number", value_type: "int" }
      - { label: "Prix d'origine barré (MAD, optionnel)", name: "originalPriceMAD", widget: "number", value_type: "int", required: false }
      - { label: "Durée", name: "duration", widget: "string", default: "3 jours / 2 nuits" }
      - { label: "Image Principale", name: "image", widget: "image" }
      - name: "gallery"
        label: "Galerie d'images (photos supplémentaires)"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Points forts (Highlights)", name: "highlights", widget: "list", field: { label: "Point fort", name: "item", widget: "string" } }
      - { label: "Voyage Populaire / Coup de cœur (popular)", name: "popular", widget: "boolean", default: true }
      - name: "archived"
        label: "Archivé ?"
        widget: "boolean"
        default: false
        hint: "Si cette case est cochée, le voyage ne sera pas visible sur le site public."
      - name: "order"
        label: "Ordre d'affichage (Position)"
        widget: "number"
        value_type: "int"
        default: 1
        required: false
        hint: "Position d'affichage (1 = premier, 2 = deuxième...). En cas d'égalité, le plus récent passe automatiquement en tête."
      - label: "Catégories du voyage"
        name: "categories"
        widget: "list"
        summary: '{{fields.category}}'
        field:
          label: "Catégorie"
          name: "category"
          widget: "select"
          options:
            - { label: "Populaire", value: "populaire" }
            - { label: "Nord du Maroc", value: "nord" }
            - { label: "Sud du Maroc", value: "sud" }
            - { label: "Région de l'Atlas", value: "atlas" }
            - { label: "Désert du Maroc", value: "desert" }
            - { label: "Voyage à l'étranger", value: "etranger" }
      - { label: "Villes de départ (optionnel)", name: "departureCities", widget: "list", field: { label: "Ville", name: "city", widget: "string" }, required: false }
      - label: "Date du voyage (Texte libre)"
        name: "dateText"
        widget: "string"
        default: "Chaque Vendredi"
        required: false
        hint: "Ce qui est tapé ici s'affiche mot pour mot sur le site (ex: Chaque vendredi, Du 15 au 20 Octobre, Tous les week-ends, etc.)."
      - { label: "Taille du groupe (optionnel)", name: "groupSize", widget: "string", default: "14 à 22 personnes", required: false }
      - label: "Programme Complet du Voyage"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Rédigez ici le programme complet et détaillé du séjour (supporte les titres #, les listes à puces -, le texte en gras et les emojis)."
      - label: "Le prix comprend"
        name: "included"
        widget: "list"
        field: { label: "Élément inclus", name: "item", widget: "string" }
        required: false
        hint: "Ajoutez chaque prestation comprise ligne par ligne."

      - label: "Le prix ne comprend pas"
        name: "excluded"
        widget: "list"
        field: { label: "Élément non inclus", name: "item", widget: "string" }
        required: false
        hint: "Ajoutez chaque élément non compris ligne par ligne. Si vide, cette section sera masquée sur le site."

      - name: "cancellation_policy"
        label: "Politique d'annulation"
        widget: "text"
        required: false
        default: "Politique d'annulation\nPour toute annulation effectuée plus de 15 jours avant la date du départ, le remboursement est total (100 %).\n\nPour toute annulation effectuée entre 7 et 15 jours avant le départ, un remboursement de 50 % du montant versé sera effectué.\n\nPour toute annulation ou réservation effectuée moins de 7 jours avant le départ, aucun remboursement ne sera possible.\n\nEn cas d’annulation par l’organisateur, le montant total sera remboursé au participant."

  # 2. Collection : Images du Slider Hero (Accueil)
  - name: "slider"
    label: "Slider Hero (Accueil)"
    label_singular: "Diapositive"
    folder: "content/slider"
    create: true
    slug: "{{order}}-{{slug}}"
    format: "json"
    editor:
      preview: true
    fields:
      - { label: "Titre du Slide", name: "title", widget: "string", default: "Dakhla & La Dune Blanche" }
      - { label: "Badge / Tag (ex: SAHARA OCÉANIQUE)", name: "tag", widget: "string", default: "Sahara Océanique" }
      - { label: "Sous-titre / Description", name: "subtitle", widget: "string", default: "Lagon turquoise & aventure 4x4 sauvage" }
      - { label: "Photo / Image du Slide (Desktop & Mobile)", name: "image", widget: "image" }
      - { label: "Photo / Image spécifique Mobile (optionnel)", name: "mobileImage", widget: "image", required: false, hint: "Optionnel : image spécifique affichée sur mobile à la place de l'image principale." }
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Lien ou Destination (optionnel)", name: "link", widget: "string", required: false }

  # 3. Collection : Questions Fréquentes (FAQ)
  - name: "faq"
    label: "Questions Fréquentes (FAQ)"
    label_singular: "Question FAQ"
    folder: "content/faq"
    create: true
    slug: "{{order}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Réponse", name: "answer", widget: "text" }
      - { label: "Ordre d'affichage", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Catégorie (optionnel)", name: "category", widget: "string", required: false, default: "Réservation" }
      - { label: "Question (Arabe, optionnel)", name: "questionAr", widget: "string", required: false }
      - { label: "Réponse (Arabe, optionnel)", name: "answerAr", widget: "text", required: false }
      - { label: "Question (Anglais, optionnel)", name: "questionEn", widget: "string", required: false }
      - { label: "Réponse (Anglais, optionnel)", name: "answerEn", widget: "text", required: false }

  # 4. Collection : Galerie Instagram (@smart_orga) - Option B
  - name: "instagram_gallery"
    label: "Galerie Instagram (@smart_orga)"
    label_singular: "Publication Instagram"
    folder: "content/instagram"
    create: true
    slug: "{{order}}-{{slug}}"
    format: "json"
    editor:
      preview: true
    fields:
      - { label: "Titre / Lieu", name: "title", widget: "string", default: "Merzouga, Sahara" }
      - { label: "Photo / Image du Post", name: "image", widget: "image" }
      - { label: "Lien Instagram (URL)", name: "link", widget: "string", default: "https://www.instagram.com/smart_orga/", required: false }
      - { label: "Nombre de Likes", name: "likes", widget: "number", default: 100, value_type: "int", required: false }
      - { label: "Nombre de Commentaires", name: "comments", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Lieu / Destination (optionnel)", name: "location", widget: "string", required: false }
      - { label: "Légende détaillée (optionnel)", name: "caption", widget: "string", required: false }
      - { label: "Lien Instagram alternatif (optionnel)", name: "post_url", widget: "string", required: false }

  # Fichier unique pour gérer le classement par Drag & Drop
  - name: "settings"
    label: "Configuration"
    files:
      - file: "content/settings/order.json"
        label: "Ordre des Voyages"
        name: "voyages_order"
        fields:
          - label: "Ordre d'affichage (Glisser-déposer les éléments)"
            name: "items"
            widget: "list"
            field:
              label: "Voyage"
              name: "voyage"
              widget: "relation"
              collection: "voyages"
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]

      # Réglage spécifique Image Hero Mobile (Uniquement smartphone < 768px)
      - file: "content/settings/hero_mobile.json"
        label: "Image Hero — Mobile"
        name: "hero_mobile"
        fields:
          - label: "Image d'arrière-plan Mobile"
            name: "image"
            widget: "image"
            default: "/assets/merzouga.png"
            required: false
            hint: "Image de fond affichée UNIQUEMENT sur mobile (smartphone < 768px). Ne modifie PAS la version ordinateur (Desktop) ni tablette."

          - label: "Position de l'image"
            name: "position"
            widget: "select"
            options:
              - { label: "Centre (Center)", value: "center" }
              - { label: "Gauche (Left)", value: "left" }
              - { label: "Droite (Right)", value: "right" }
            default: "center"
            hint: "Cadrage de l'image sur l'écran du smartphone."

          - label: "Intensité du voile d'assombrissement / Overlay (%)"
            name: "overlayOpacity"
            widget: "number"
            value_type: "int"
            min: 0
            max: 90
            default: 50
            hint: "Pourcentage d'assombrissement transparent pour garantir la lisibilité parfaite du texte (recommandé: 40% à 60%)."

          - label: "Ajustement de luminosité (Brightness)"
            name: "brightness"
            widget: "select"
            options:
              - { label: "Normale (100%)", value: "normal" }
              - { label: "Légèrement assombrie (90%)", value: "dimmed" }
              - { label: "Assombrie (75%)", value: "dark" }
            default: "normal"
            required: false

          - label: "Activer l'image sur Mobile"
            name: "enabled"
            widget: "boolean"
            default: true
            hint: "Désactiver pour revenir au fond dégradé par défaut sans image."


