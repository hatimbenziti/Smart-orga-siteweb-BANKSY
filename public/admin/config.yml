backend:
  name: github
  repo: hatimbenziti/Smart-orga-siteweb-BANKSY
  branch: main
  base_url: https://www.smartorga.ma
  auth_endpoint: /api/auth

# Mode local actif pour développement (via npx decap-server)
local_backend: true

# Configuration des dossiers médias
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Localisation de l'interface
locale: "fr"
display_url: "https://smartorga.ma"

collections:
  # 1. Collection : Voyages Organisés
  - name: "voyages"
    label: "Voyages Organisés"
    label_singular: "Voyage"
    folder: "content/voyages"
    create: true
    slug: "{{slug}}"
    format: "json"
    editor:
      preview: true
    fields:
      - { label: "Titre du Séjour", name: "title", widget: "string" }
      - { label: "Destination", name: "destination", widget: "string", default: "Merzouga & Sud Marocain" }
      - { label: "Région / Thématique", name: "region", widget: "select", options: ["Désert & Dunes", "Villes Impériales", "Nature & Randonnée", "Plages & Surf"], default: "Désert & Dunes" }
      - { label: "Prix (MAD)", name: "price", widget: "number", value_type: "int" }
      - { label: "Prix d'origine barré (MAD, optionnel)", name: "originalPriceMAD", widget: "number", value_type: "int", required: false }
      - { label: "Durée", name: "duration", widget: "string", default: "3 jours / 2 nuits" }
      - { label: "Image Principale", name: "image", widget: "image" }
      - label: "Galerie Photos (optionnel)"
        name: "gallery"
        widget: "list"
        field: { label: "Photo", name: "photo", widget: "image" }
        required: false
      - { label: "Points forts (Highlights)", name: "highlights", widget: "list", field: { label: "Point fort", name: "item", widget: "string" } }
      - { label: "Voyage Populaire / Coup de cœur (popular)", name: "popular", widget: "boolean", default: true }
      - { label: "Ordre / Priorité d'affichage (order)", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Catégorie", name: "category", widget: "select", options: ["popular", "weekly", "upcoming", "all"], default: "popular" }
      - { label: "Villes de départ (optionnel)", name: "departureCities", widget: "list", field: { label: "Ville", name: "city", widget: "string" }, required: false }
      - { label: "Prochaine date de départ (optionnel)", name: "nextDate", widget: "string", required: false }
      - { label: "Taille du groupe (optionnel)", name: "groupSize", widget: "string", default: "14 à 22 personnes", required: false }
      - label: "Météo du Séjour & Prévisions des Jours"
        name: "weather"
        widget: "object"
        required: false
        fields:
          - { label: "Température moyenne (ex: 26°C)", name: "temp", widget: "string", default: "26°C" }
          - { label: "Condition météo générale (ex: Ensoleillé & Ciel pur)", name: "condition", widget: "string", default: "Ensoleillé & Ciel pur" }
          - label: "Météo détaillée des jours"
            name: "dailyForecast"
            widget: "list"
            required: false
            fields:
              - { label: "Numéro du jour (1, 2, 3...)", name: "day", widget: "number", value_type: "int", default: 1 }
              - { label: "Température (ex: 26°C)", name: "temp", widget: "string", default: "26°C" }
              - { label: "Météo du jour (ex: Grand soleil)", name: "condition", widget: "string", default: "Grand soleil" }
      - label: "Programme Complet du Voyage"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Rédigez ici le programme complet et détaillé du séjour (supporte les titres #, les listes à puces -, le texte en gras et les emojis)."
      - name: "included"
        label: "Le prix comprend (un élément par ligne)"
        widget: "list"
        required: false
        default:
          - "Transport touristique tout confort climatisé A/R"
          - "Hébergement en demi-pension ou formule adaptée"
          - "Accompagnateur dédié & assistance 24h/24 Smart Orga"

      - name: "excluded"
        label: "Le prix ne comprend pas (un élément par ligne)"
        widget: "list"
        required: false
        default:
          - "Déjeuners libres en cours de route"
          - "Boissons et dépenses personnelles"

      - name: "cancellation_policy"
        label: "Politique d'annulation"
        widget: "text"
        required: false
        default: "Politique d'annulation\nPour toute annulation effectuée plus de 15 jours avant la date du départ, le remboursement est total (100 %).\n\nPour toute annulation effectuée entre 7 et 15 jours avant le départ, un remboursement de 50 % du montant versé sera effectué.\n\nPour toute annulation ou réservation effectuée moins de 7 jours avant le départ, aucun remboursement ne sera possible.\n\nEn cas d’annulation par l’organisateur, le montant total sera remboursé au participant."

  # 2. Collection : Images du Slider Hero (Accueil)
  - name: "slider"
    label: "Slider Hero (Accueil)"
    label_singular: "Diapositive"
    folder: "content/slider"
    create: true
    slug: "{{order}}-{{slug}}"
    format: "json"
    editor:
      preview: true
    fields:
      - { label: "Titre du Slide", name: "title", widget: "string", default: "Dakhla & La Dune Blanche" }
      - { label: "Badge / Tag (ex: SAHARA OCÉANIQUE)", name: "tag", widget: "string", default: "Sahara Océanique" }
      - { label: "Sous-titre / Description", name: "subtitle", widget: "string", default: "Lagon turquoise & aventure 4x4 sauvage" }
      - { label: "Photo / Image du Slide", name: "image", widget: "image" }
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Lien ou Destination (optionnel)", name: "link", widget: "string", required: false }

  # 3. Collection : Questions Fréquentes (FAQ)
  - name: "faq"
    label: "Questions Fréquentes (FAQ)"
    label_singular: "Question FAQ"
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Réponse", name: "answer", widget: "text" }
      - { label: "Ordre", name: "order", widget: "number", default: 1 }

  # 4. Collection : Galerie Instagram (@smart_orga) - Option B
  - name: "instagram_gallery"
    label: "Galerie Instagram (@smart_orga)"
    label_singular: "Publication Instagram"
    folder: "content/instagram"
    create: true
    slug: "{{order}}-{{slug}}"
    format: "json"
    editor:
      preview: true
    fields:
      - { label: "Titre / Lieu", name: "title", widget: "string", default: "Merzouga, Sahara" }
      - { label: "Photo / Image du Post", name: "image", widget: "image" }
      - { label: "Lien Instagram (URL)", name: "link", widget: "string", default: "https://www.instagram.com/smart_orga/", required: false }
      - { label: "Nombre de Likes", name: "likes", widget: "number", default: 100, value_type: "int", required: false }
      - { label: "Nombre de Commentaires", name: "comments", widget: "number", default: 10, value_type: "int", required: false }
      - { label: "Ordre d'affichage (1 = en premier)", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Lieu / Destination (optionnel)", name: "location", widget: "string", required: false }
      - { label: "Légende détaillée (optionnel)", name: "caption", widget: "string", required: false }
      - { label: "Lien Instagram alternatif (optionnel)", name: "post_url", widget: "string", required: false }
