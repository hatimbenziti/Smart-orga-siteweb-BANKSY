<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Orga - Dashboard Admin (Decap CMS)</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon%20192.png" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    /* Styling for the Vercel helper bar when not yet authenticated */
    #cms-helper-bar {
      display: none;
      background: #0f172a;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid #1e293b;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 99999;
    }
    #cms-helper-bar.visible {
      display: flex;
    }
    #cms-helper-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    #cms-helper-bar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="cms-helper-bar">
    <span>🚀 <strong>Smart Orga CMS (Vercel)</strong> : Connectez-vous avec GitHub pour éditer voyages, slider et galeries.</span>
    <a href="/" target="_blank">← Retour au site public</a>
  </div>

  <!-- Decap CMS Core Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var bar = document.getElementById('cms-helper-bar');
      if (bar) bar.classList.add('visible');
    });

    // 2. Style personnalisé pour le Dashboard & Previews via CMS.registerPreviewStyle()
    if (window.CMS) {
      CMS.registerPreviewStyle('/admin/admin-styles.css');

      // Custom preview component for voyages to apply the archived grayscale effect in the editor preview
      var VoyagePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var isArchived = Boolean(entry.getIn(['data', 'archived']));
          var title = entry.getIn(['data', 'title']) || 'Titre du voyage';
          var destination = entry.getIn(['data', 'destination']) || '';
          var price = entry.getIn(['data', 'price']) || '';
          var image = this.props.getAsset(entry.getIn(['data', 'image']));
          var order = entry.getIn(['data', 'order']) || entry.getIn(['data', 'ordre']) || 1;

          return h('div', {
            className: isArchived ? 'archived-preview' : 'active-preview',
            style: isArchived ? {
              filter: 'grayscale(100%)',
              opacity: 0.5,
              border: '2px dashed #94a3b8',
              borderRadius: '12px',
              padding: '16px',
              background: '#f8fafc',
              fontFamily: 'system-ui, sans-serif'
            } : {
              padding: '16px',
              borderRadius: '12px',
              background: '#ffffff',
              fontFamily: 'system-ui, sans-serif',
              border: '1px solid #e2e8f0'
            }
          },
            isArchived ? h('div', {
              style: {
                display: 'inline-block',
                background: '#64748b',
                color: '#ffffff',
                fontSize: '11px',
                fontWeight: 'bold',
                padding: '3px 8px',
                borderRadius: '6px',
                marginBottom: '10px'
              }
            }, 'VOYAGE ARCHIVÉ (MASQUÉ DU SITE)') : null,
            image ? h('img', { src: image.toString(), style: { maxWidth: '100%', height: '220px', objectFit: 'cover', borderRadius: '8px', marginBottom: '12px' } }) : null,
            h('h2', { style: { margin: '0 0 8px 0', fontSize: '20px', color: '#1e293b' } }, title),
            h('p', { style: { margin: '4px 0', color: '#64748b' } }, '📍 Destination: ' + destination + (price ? ' | 💰 ' + price + ' MAD' : '') + ' | 🔢 Ordre: ' + order),
            h('hr', { style: { margin: '14px 0', borderColor: '#e2e8f0' } }),
            this.props.widgetFor('body')
          );
        }
      });

      CMS.registerPreviewTemplate('voyages', VoyagePreview);

      // 3. Custom preview component for Image Hero — Mobile
      var HeroMobilePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var image = this.props.getAsset(entry.getIn(['data', 'image']));
          var position = entry.getIn(['data', 'position']) || 'center';
          var opacity = Number(entry.getIn(['data', 'overlayOpacity'])) || 50;
          var brightness = entry.getIn(['data', 'brightness']) || 'normal';
          var enabled = entry.getIn(['data', 'enabled']) !== false;
          var imgSrc = image ? image.toString() : '/assets/merzouga.png';

          var posStyle = 'center center';
          if (position === 'left') posStyle = 'left center';
          if (position === 'right') posStyle = 'right center';

          var filterStyle = 'brightness(1)';
          if (brightness === 'dimmed') filterStyle = 'brightness(0.9)';
          if (brightness === 'dark') filterStyle = 'brightness(0.75)';

          return h('div', {
            style: {
              padding: '24px',
              fontFamily: 'system-ui, -apple-system, sans-serif',
              maxWidth: '420px',
              margin: '0 auto'
            }
          },
            h('div', {
              style: {
                background: '#0f172a',
                color: '#38bdf8',
                padding: '10px 14px',
                borderRadius: '12px 12px 0 0',
                fontSize: '12px',
                fontWeight: 'bold',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between'
              }
            },
              h('span', null, '📱 Aperçu Hero Smartphone (< 768px)'),
              h('span', { style: { color: '#94a3b8', fontSize: '10px' } }, 'Mobile Uniquement')
            ),
            h('div', {
              style: {
                position: 'relative',
                width: '100%',
                height: '480px',
                borderRadius: '0 0 16px 16px',
                overflow: 'hidden',
                boxShadow: '0 20px 25px -5px rgba(0, 0, 0, 0.3)',
                border: '3px solid #1e293b',
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'center',
                padding: '24px',
                boxSizing: 'border-box'
              }
            },
              // Background image
              enabled ? h('img', {
                src: imgSrc,
                style: {
                  position: 'absolute',
                  top: 0,
                  left: 0,
                  width: '100%',
                  height: '100%',
                  objectFit: 'cover',
                  objectPosition: posStyle,
                  filter: filterStyle,
                  zIndex: 1
                }
              }) : null,
              // Transparent gradient overlay
              enabled ? h('div', {
                style: {
                  position: 'absolute',
                  top: 0,
                  left: 0,
                  width: '100%',
                  height: '100%',
                  backgroundColor: 'rgba(15, 23, 42, ' + (opacity / 100) + ')',
                  backgroundImage: 'linear-gradient(180deg, rgba(15, 23, 42, ' + ((opacity/100)*0.75) + ') 0%, rgba(15, 23, 42, ' + Math.min(0.92, (opacity/100)*1.15) + ') 100%)',
                  zIndex: 2
                }
              }) : null,
              // Content
              h('div', {
                style: {
                  position: 'relative',
                  zIndex: 3,
                  color: '#ffffff'
                }
              },
                h('div', {
                  style: {
                    display: 'inline-block',
                    background: 'rgba(255, 255, 255, 0.95)',
                    color: '#1d4ed8',
                    padding: '4px 12px',
                    borderRadius: '9999px',
                    fontSize: '11px',
                    fontWeight: 'bold',
                    marginBottom: '14px',
                    textTransform: 'uppercase'
                  }
                }, 'VOYAGEZ EN TOUTE QUIÉTUDE'),
                h('h1', {
                  style: {
                    fontSize: '24px',
                    fontWeight: '800',
                    lineHeight: '1.25',
                    margin: '0 0 18px 0',
                    color: '#ffffff',
                    textShadow: '0 2px 4px rgba(0,0,0,0.5)'
                  }
                },
                  'Voyagez en groupe et ',
                  h('span', { style: { color: '#60a5fa' } }, 'Créez des souvenirs'),
                  ' avec Smart Orga'
                ),
                h('div', {
                  style: {
                    display: 'flex',
                    flexDirection: 'column',
                    gap: '10px'
                  }
                },
                  h('div', {
                    style: {
                      background: '#2563eb',
                      color: '#ffffff',
                      padding: '12px',
                      borderRadius: '10px',
                      fontWeight: 'bold',
                      fontSize: '13px',
                      textAlign: 'center'
                    }
                  }, 'Découvrez nos séjours →'),
                  h('div', {
                    style: {
                      background: 'rgba(255, 255, 255, 0.95)',
                      color: '#0f172a',
                      padding: '12px',
                      borderRadius: '10px',
                      fontWeight: 'bold',
                      fontSize: '13px',
                      textAlign: 'center'
                    }
                  }, '✨ Voyages Populaires')
                )
              )
            ),
            h('div', {
              style: {
                marginTop: '16px',
                padding: '12px',
                background: '#f8fafc',
                borderRadius: '8px',
                fontSize: '11px',
                color: '#64748b',
                lineHeight: '1.6',
                border: '1px solid #e2e8f0'
              }
            },
              h('div', null, h('strong', null, 'Position cadrage : '), position),
              h('div', null, h('strong', null, 'Voile assombrissant (Overlay) : '), opacity + '%'),
              h('div', null, h('strong', null, 'Luminosité : '), brightness),
              h('div', { style: { color: '#059669', marginTop: '4px', fontWeight: 'bold' } }, '✓ N\'impacte ni la version Ordinateur ni la version Tablette.')
            )
          );
        }
      });

      CMS.registerPreviewTemplate('hero_mobile', HeroMobilePreview);
    }

    // Observer to tag collection cards on dashboard so that archived entries get styled in real-time
    function applyArchivedStylesToDashboard() {
      try {
        var cards = document.querySelectorAll('main a[href*="/collections/voyages/entries/"], main article, div[class*="Card"]');
        cards.forEach(function(card) {
          var text = card.textContent || '';
          if (text.includes('Archivé') || text.includes('archived: true') || card.querySelector('[class*="archived"]')) {
            card.setAttribute('data-archived', 'true');
            card.style.filter = 'grayscale(100%)';
            card.style.opacity = '0.5';
            card.style.border = '2px dashed #94a3b8';
          }
        });
      } catch (e) {}
    }

    setInterval(applyArchivedStylesToDashboard, 1000);
  </script>
</body>
</html>
