<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Orga - Dashboard Admin (Decap CMS)</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon%20192.png" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    /* Styling for the Vercel helper bar when not yet authenticated */
    #cms-helper-bar {
      display: none;
      background: #0f172a;
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      padding: 8px 16px;
      border-bottom: 1px solid #1e293b;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 99999;
    }
    #cms-helper-bar.visible {
      display: flex;
    }
    #cms-helper-bar a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    #cms-helper-bar a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="cms-helper-bar">
    <span>🚀 <strong>Smart Orga CMS (Vercel)</strong> : Connectez-vous avec GitHub pour éditer voyages, slider et galeries.</span>
    <a href="/" target="_blank">← Retour au site public</a>
  </div>

  <script>
    // Manual CMS initialization to ensure custom widgets are registered first
    window.CMS_MANUAL_INIT = true;
  </script>

  <!-- Decap CMS Core Script -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function() {
      var recurringDays = [
        'Chaque Lundi',
        'Chaque Mardi',
        'Chaque Mercredi',
        'Chaque Jeudi',
        'Chaque Vendredi',
        'Chaque Samedi',
        'Chaque Dimanche'
      ];

      var TripDateControl = window.createClass({
        getInitialState: function() {
          var val = (this.props.value || '').trim();
          var isFixed = /^\d{4}-\d{2}-\d{2}$/.test(val);
          var today = new Date().toISOString().split('T')[0];

          var mode = isFixed ? 'fixed' : 'recurring';
          var fixedDate = isFixed ? val : today;
          var recurringDay = recurringDays.indexOf(val) !== -1 ? val : 'Chaque Vendredi';

          return {
            mode: mode,
            fixedDate: fixedDate,
            recurringDay: recurringDay
          };
        },

        componentDidMount: function() {
          if (!this.props.value) {
            var initial = this.state.mode === 'fixed' ? this.state.fixedDate : this.state.recurringDay;
            this.props.onChange(initial);
          }
        },

        handleModeChange: function(newMode) {
          this.setState({ mode: newMode });
          if (newMode === 'fixed') {
            this.props.onChange(this.state.fixedDate);
          } else {
            this.props.onChange(this.state.recurringDay);
          }
        },

        handleFixedDateChange: function(e) {
          var val = e.target.value;
          this.setState({ fixedDate: val });
          this.props.onChange(val);
        },

        handleRecurringDayChange: function(e) {
          var val = e.target.value;
          this.setState({ recurringDay: val });
          this.props.onChange(val);
        },

        render: function() {
          var h = window.h;
          var mode = this.state.mode;
          var self = this;
          var currentValue = mode === 'fixed' ? this.state.fixedDate : this.state.recurringDay;
          var uniqueName = 'trip_date_radio_' + (this.props.forID || 'id');

          return h('div', {
            style: {
              padding: '16px',
              border: '1px solid #cbd5e1',
              borderRadius: '8px',
              backgroundColor: '#f8fafc',
              marginTop: '6px'
            }
          }, [
            // Sélecteur principal (Radio Group à 2 options exclusives)
            h('div', {
              key: 'radio-group',
              style: {
                display: 'flex',
                gap: '24px',
                alignItems: 'center',
                marginBottom: '14px'
              }
            }, [
              h('label', {
                key: 'opt-fixed',
                style: {
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '8px',
                  cursor: 'pointer',
                  fontSize: '15px',
                  fontWeight: mode === 'fixed' ? '700' : '500',
                  color: mode === 'fixed' ? '#0f172a' : '#475569'
                }
              }, [
                h('input', {
                  type: 'radio',
                  name: uniqueName,
                  value: 'fixed',
                  checked: mode === 'fixed',
                  onChange: function() { self.handleModeChange('fixed'); },
                  style: {
                    width: '18px',
                    height: '18px',
                    cursor: 'pointer',
                    accentColor: '#0284c7'
                  }
                }),
                'Date fixe'
              ]),
              h('label', {
                key: 'opt-recurring',
                style: {
                  display: 'inline-flex',
                  alignItems: 'center',
                  gap: '8px',
                  cursor: 'pointer',
                  fontSize: '15px',
                  fontWeight: mode === 'recurring' ? '700' : '500',
                  color: mode === 'recurring' ? '#0f172a' : '#475569'
                }
              }, [
                h('input', {
                  type: 'radio',
                  name: uniqueName,
                  value: 'recurring',
                  checked: mode === 'recurring',
                  onChange: function() { self.handleModeChange('recurring'); },
                  style: {
                    width: '18px',
                    height: '18px',
                    cursor: 'pointer',
                    accentColor: '#0284c7'
                  }
                }),
                'Jour récurrent'
              ])
            ]),

            // Affichage conditionnel exclusif
            mode === 'fixed'
              ? h('div', { key: 'view-fixed' }, [
                  h('label', {
                    style: {
                      display: 'block',
                      fontSize: '13px',
                      fontWeight: '600',
                      color: '#334155',
                      marginBottom: '6px'
                    }
                  }, 'Sélectionnez la date exacte (YYYY-MM-DD) :'),
                  h('input', {
                    id: self.props.forID,
                    type: 'date',
                    value: self.state.fixedDate,
                    onChange: self.handleFixedDateChange,
                    style: {
                      display: 'block',
                      width: '100%',
                      maxWidth: '300px',
                      padding: '9px 12px',
                      fontSize: '14px',
                      border: '1px solid #94a3b8',
                      borderRadius: '6px',
                      backgroundColor: '#ffffff',
                      color: '#0f172a',
                      outline: 'none',
                      boxShadow: '0 1px 2px rgba(0,0,0,0.05)'
                    }
                  })
                ])
              : h('div', { key: 'view-recurring' }, [
                  h('label', {
                    style: {
                      display: 'block',
                      fontSize: '13px',
                      fontWeight: '600',
                      color: '#334155',
                      marginBottom: '6px'
                    }
                  }, 'Sélectionnez le jour récurrent :'),
                  h('select', {
                    id: self.props.forID,
                    value: self.state.recurringDay,
                    onChange: self.handleRecurringDayChange,
                    style: {
                      display: 'block',
                      width: '100%',
                      maxWidth: '300px',
                      padding: '9px 12px',
                      fontSize: '14px',
                      border: '1px solid #94a3b8',
                      borderRadius: '6px',
                      backgroundColor: '#ffffff',
                      color: '#0f172a',
                      outline: 'none',
                      cursor: 'pointer',
                      boxShadow: '0 1px 2px rgba(0,0,0,0.05)'
                    }
                  }, recurringDays.map(function(choice) {
                    return h('option', { key: choice, value: choice }, choice);
                  }))
                ]),

            // Aperçu de la valeur finale enregistrée dans displayDate
            h('div', {
              key: 'preview-saved',
              style: {
                marginTop: '12px',
                padding: '8px 12px',
                backgroundColor: '#eff6ff',
                border: '1px solid #bfdbfe',
                borderRadius: '6px',
                fontSize: '13px',
                color: '#1e40af'
              }
            }, [
              h('span', null, 'Valeur enregistrée dans '),
              h('code', { style: { background: '#dbeafe', padding: '2px 4px', borderRadius: '3px' } }, 'displayDate'),
              h('span', null, ' : '),
              h('strong', null, currentValue)
            ])
          ]);
        }
      });

      var TripDatePreview = window.createClass({
        render: function() {
          var h = window.h;
          return h('div', { style: { padding: '8px', fontSize: '14px', color: '#0f172a' } },
            'Date affichée : ' + (this.props.value || 'Non configurée')
          );
        }
      });

      window.CMS.registerWidget('trip_date', TripDateControl, TripDatePreview);
      window.CMS.init();
    })();

    window.addEventListener('DOMContentLoaded', function() {
      var bar = document.getElementById('cms-helper-bar');
      if (bar) bar.classList.add('visible');
    });
  </script>
</body>
</html>
